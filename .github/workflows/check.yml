name: Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-features

  # Tag and release the version in Cargo.toml, once the checks above are green.
  # Bumping `version` in Cargo.toml on main is the whole release ritual: this
  # job then creates `v<version>`, and `publish` below pushes it to crates.io.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Release the version in Cargo.toml, if it has no release yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The first line-anchored `version` in the manifest is the package's;
          # dependency versions sit inside inline tables, never at line start.
          version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::no package version found"
            exit 1
          fi
          tag="v$version"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Creates the tag at this commit as well, unless it already exists.
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes
          echo "Released $tag." >> "$GITHUB_STEP_SUMMARY"

  # Push that same version to crates.io. Runs after `release` so a failed
  # publish leaves a tag that can be deleted and retried, rather than an
  # untagged crate release (crates.io versions can only be yanked, never
  # withdrawn).
  #
  # Authentication is Trusted Publishing (https://crates.io/docs/trusted-publishing):
  # no API token is stored anywhere. crates.io verifies an OIDC token minted by
  # GitHub for this job, so the crate's Trusted Publishing config must name this
  # repository, the workflow filename `check.yml`, and the `release` environment.
  publish:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Lets the job mint the OIDC token that crates.io trades for a
      # short-lived publish token.
      id-token: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Every push to main reaches this job, so ask crates.io whether this
      # version is already there instead of letting `cargo publish` fail on it.
      - name: Check whether this version is already published
        id: check
        run: |
          set -euo pipefail
          # As in the release job: the first line-anchored key is the package's.
          name="$(awk -F'"' '/^name = "/ { print $2; exit }' Cargo.toml)"
          version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "User-Agent: $GITHUB_REPOSITORY release workflow" \
            "https://crates.io/api/v1/crates/$name/$version")"
          case "$status" in
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "$name $version is already on crates.io; nothing to do." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::crates.io returned HTTP $status for $name $version"
              exit 1
              ;;
          esac

      - name: Authenticate with crates.io
        id: auth
        if: steps.check.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
