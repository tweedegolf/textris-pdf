[package]
name = "textris-pdf"
version = "0.10.2"
license = "MIT"
edition = "2024"
description = "Simple but opinionated document generation"
repository = "https://github.com/tweedegolf/textris-pdf"
readme = "README.md"
keywords = ["pdf", "accessibility", "pdf-ua", "typesetting", "document"]
categories = ["accessibility", "text-processing", "rendering"]
exclude = ["/tests", "/docs", "/textris-web-editor", "/.github"]

[workspace]
members = ["textris-web-editor"]

# Workspace-local: profile settings in a dependency are ignored by downstream
# consumers. Chiefly here to shrink the wasm bundle.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[dependencies]
harfrust = "0.13"
krilla = { version = "0.8", default-features = false }
# Pinned to whatever `harfrust` depends on: font tables read here are handed
# straight to the shaper, so a second `read-fonts` version does not type-check.
read-fonts = "0.43"
time = { version = "0.3", default-features = false, features = ["std"] }
docx-rs = { version = "0.4", optional = true }

[features]
default = ["markdown", "markdown-parser"]
docx = ["dep:docx-rs"]
markdown = []
markdown-parser = ["markdown"]
